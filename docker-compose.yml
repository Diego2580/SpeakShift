# docker-compose.yml
name: speakshift

services:
  # ---------------------------------------------------------------------------
  # Base de datos PostgreSQL
  # ---------------------------------------------------------------------------
  db:
    image: postgres:16-alpine
    container_name: speakshift_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      # Persistencia de datos
      - postgres_data:/var/lib/postgresql/data
      # Script DDL: se ejecuta SOLO la primera vez que se crea el volumen
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      # Solo accesible desde localhost (útil para DBeaver/pgAdmin en desarrollo)
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - speakshift_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------------
  # Backend FastAPI
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: speakshift_api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # El host es el nombre del servicio dentro de la red interna de Docker
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    volumes:
      # Hot-reload en desarrollo
      - ./backend/app:/code/app
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy   # Espera a que Postgres esté listo
    networks:
      - speakshift_net
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  postgres_data:

networks:
  speakshift_net:
    driver: bridge